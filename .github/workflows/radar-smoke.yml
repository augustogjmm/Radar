name: Radar Core Smoke

on:
  push:
    branches: [main, v8-core-rescue]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: radar-core-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Radar QA server
        run: |
          node scripts/qa-server.mjs > /tmp/radar-server.log 2>&1 &
          echo $! > /tmp/radar-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/radar-server.log
          exit 1
      - name: Run core browser smoke
        run: node scripts/smoke-test.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-core-smoke
          path: |
            artifacts
            /tmp/radar-server.log
          if-no-files-found: ignore
