name: Radar v7 Investor Contract

on:
  push:
    branches: [v7-product-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: radar-v7-investor-contract
  cancel-in-progress: true

jobs:
  investor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: |
          node --check runtime/16-investor-workspace.js
          node --check scripts/smoke-test.mjs
      - name: Start Radar QA server
        run: |
          node scripts/qa-server.mjs > /tmp/radar-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/radar-server.log
          exit 1
      - name: Run investor contract
        run: node scripts/smoke-test.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-v7-investor-contract
          path: artifacts/
          if-no-files-found: ignore
