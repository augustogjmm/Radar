name: Radar Product Flow

on:
  push:
    branches: [v8-core-rescue]
  workflow_dispatch:

jobs:
  product-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check workspace/engine.js
          node --check workspace/app.js
          node --check scripts/workspace-smoke.mjs
      - name: Start server
        run: |
          node scripts/qa-server.mjs > /tmp/radar.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/workspace/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/radar.log
          exit 1
      - name: Test investor flow
        run: node scripts/workspace-smoke.mjs
